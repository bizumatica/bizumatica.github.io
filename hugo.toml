# ==============================================================================
# CONFIGURAÇÃO CORE DO SITE (GLOBAL)
# ==============================================================================
baseURL = "https://bizumatica.com.br/"
title = "Bizumática"
theme = "terminal"

# Idioma e Localização (Mapeamento rigoroso BCP 47 - Hugo v0.158.0+)
defaultContentLanguage = "pt-br"
locale = "pt-BR"
enableEmoji = true

[languages]
  [languages.pt-br]
    title = "Bizumática"
    label = "Português"
    locale = "pt-BR"
    weight = 1

# Tratamento de URLs e Higienização de Build
removePathAccents = true
cleanDestinationDir = true
enableRobotsTXT = true

# Preservação de URLs Absolutas (Invariante no SEO & AdSense)
canonifyURLs = false
relativeURLs = false

# ==============================================================================
# TIPOS DE MÍDIA E FORMATOS DE SAÍDA (Obrigatório para API de Busca)
# ==============================================================================
[outputs]
  home = ["HTML", "RSS", "JSON"]
  page = ["HTML"]
  section = ["HTML", "RSS"]

[mediaTypes]
  [mediaTypes."application/json"]
    suffixes = ["json"]

[outputFormats]
  [outputFormats.JSON]
    mediaType = "application/json"
    baseName = "index"
    isPlainText = true

# ==============================================================================
# PARÂMETROS DO TEMA TERMINAL & ADTECH
# ==============================================================================
[params]
  # ESSENCIAL PARA O TEMA TERMINAL: Define qual seção do content/ alimenta a Home
  contentTypeName = "posts"
  
  themeColor = "orange"
  centerTheme = true
  animatedTheme = true
  favicon = "favicon.png"
  customCSS = ["css/extended.css"]

  # Exibição de Data nos Posts
  showMenu = true
  showReadingTime = true
  showTableOfContents = true

  [params.Logo]
    logoText = "Bizumática"
    logoHomeLink = "/"
    logoCursorStyle = "block"

  # AdTech / Monetização Google AdSense
  [params.adsense]
    client = "ca-pub-3733806324330520"

# ==============================================================================
# PROCESSAMENTO DE IMAGENS (LCP OPTIMIZATION PIPELINE)
# ==============================================================================
[imaging]
  resampleFilter = "lanczos"
  quality = 85
  anchor = "smart"

# ==============================================================================
# TAXONOMIAS (Evita Thin Content / Taxonomias Fantasmas)
# ==============================================================================
[taxonomies]
  category = "categories"
  tag = "tags"
  series = "series"

# ==============================================================================
# ENGINE DE CONTEÚDO RELACIONADO (MATRIZ TF-IDF EM SSG)
# ==============================================================================
[related]
  threshold = 50
  includeNewer = true
  toLower = true

  [[related.indices]]
    name = "categories"
    weight = 100

  [[related.indices]]
    name = "series"
    weight = 80

  [[related.indices]]
    name = "tags"
    weight = 50

  [[related.indices]]
    name = "date"
    weight = 10

# ==============================================================================
# CONFIGURAÇÃO DE SITEMAP
# ==============================================================================
[sitemap]
  filename = "sitemap.xml"
  priority = 0.8

# ==============================================================================
# PRIVACIDADE E CONFORMIDADE (GDPR / GOOGLE ADSENSE POLICY)
# ==============================================================================
[privacy]
  [privacy.googleAnalytics]
    anonymizeIP = true
    disable = false
  [privacy.youtube]
    privacyEnhanced = true

# ==============================================================================
# RENDERIZAÇÃO DE MARKUP (KaTeX + HTML Seguro + Atributos Goldmark)
# ==============================================================================
[markup]
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false

  [markup.goldmark]
    [markup.goldmark.parser]
      [markup.goldmark.parser.attribute]
        title = true

    [markup.goldmark.renderer]
      unsafe = true

    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['$$', '$$'], ['\\[', '\\]']]
          inline = [['$', '$'], ['\\(', '\\)']]

