{{ $slot := .Get "slot" | default "4043462063" }}

<div class="ad-container">
    {{ if not hugo.IsServer }}
        <ins class="adsbygoogle"
             style="display:block"
             data-ad-client="ca-pub-3733806324330520"
             data-ad-slot="{{ $slot }}"
             data-ad-format="auto"
             data-full-width-responsive="true"></ins>
        <script>
             (adsbygoogle = window.adsbygoogle || []).push({});
        </script>
    {{ else }}
        <div class="ad-dev-stub" role="region" aria-label="Anúncio (Simulação Local)" style="background: #1a1b27; border: 1px dashed #00ff41; color: #00ff41; padding: 1.5rem; font-family: 'Fira Code', monospace; width: 100%; text-align: center; box-sizing: border-box;">
            <p style="margin: 0; font-weight: bold;">[ ⚡ AD_SYSTEM_STUB: SLOT {{ $slot }} ]</p>
            <p style="font-size: 0.75rem; color: #ff79c6; margin: 4px 0 0 0;">Status: READY_FOR_DEPLOY (Simulação Local)</p>
        </div>
    {{ end }}
</div>
